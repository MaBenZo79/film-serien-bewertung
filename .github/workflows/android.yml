name: Android APK

on:
  push:
    branches: [main, admin, feature/mcu-card-opening]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare Scorium logo PNG
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 --decode app/src/main/scorium_logo.png.base64 > app/src/main/res/drawable-nodpi/scorium_logo.png
          base64 --decode app/src/main/scorium_icon.png.base64 > app/src/main/res/drawable-nodpi/scorium_icon.png
          base64 --decode app/src/main/scorium_menu_background.webp.base64 > app/src/main/res/drawable-nodpi/scorium_menu_background.webp
          test -s app/src/main/res/drawable-nodpi/scorium_logo.png
          cp scorium_dev_icon.png app/src/main/res/drawable/scorium_dev_icon.png
          test -s app/src/main/res/drawable/scorium_dev_icon.png
          test -s app/src/main/res/drawable-nodpi/scorium_icon.png
          test -s app/src/main/res/drawable-nodpi/scorium_menu_background.webp
          file app/src/main/res/drawable-nodpi/scorium_menu_background.webp | grep -i Web/P
          file app/src/main/res/drawable-nodpi/scorium_icon.png
      - name: Bundle public SCORIUM catalog and artwork
        run: |
          mkdir -p app/src/main/assets/starter/posters app/src/main/res/drawable-nodpi
          unzip -q -o SCORIUM_Originalgrafiken.zip -d /tmp/scorium-artwork
          cp /tmp/scorium-artwork/app/src/main/res/drawable-nodpi/scorium_header.png app/src/main/res/drawable-nodpi/scorium_header.png
          cp /tmp/scorium-artwork/app/src/main/res/drawable-nodpi/scorium_poster.png app/src/main/res/drawable-nodpi/scorium_poster.png
          cp /tmp/scorium-artwork/app/src/main/res/drawable-nodpi/scorium_collection.png app/src/main/res/drawable-nodpi/scorium_collection.png
          # The five full backup parts supersede the previous poster archives.
          for n in 001 002 003 004 005; do
            test -s "SCORIUM-Backup-Teil-${n}.zip"
            unzip -q -o "SCORIUM-Backup-Teil-${n}.zip" -d app/src/main/assets/starter
          done
          test "$(find app/src/main/assets/starter/posters -name '*.jpg' | wc -l)" -eq 273
          python3 - <<'PY'
          import json
          from pathlib import Path
          source_path=Path('app/src/main/assets/starter/scorium-data.json')
          source=json.loads(source_path.read_text(encoding='utf-8'))
          allowed=lambda k: k in ('custom_titles','custom_series') or k.startswith(('seasons::','episodes::'))
          public={k:v for k,v in source.items() if allowed(k)}
          Path('app/src/main/assets/starter/catalog.json').write_text(json.dumps(public,ensure_ascii=False),encoding='utf-8')
          source_path.unlink()
          print('Bundled',len(public),'catalog keys and 273 posters; no personal ratings')
          PY
          test -s app/src/main/res/drawable-nodpi/scorium_header.png
          test -s app/src/main/assets/starter/catalog.json
      - name: Prepare STAR WARS collection assets
        run: |
          mkdir -p app/src/main/res/raw app/src/main/res/drawable-nodpi
          cp scorium_star_wars_logo.png app/src/main/res/drawable-nodpi/scorium_star_wars_logo.png
          cp app/src/main/assets/scorium_star_wars_intro.mp4 app/src/main/res/raw/star_wars_collection_intro.mp4
          test -s app/src/main/res/raw/star_wars_collection_intro.mp4
      - name: Set up Python for SCORIUM intro artwork
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Create animated intro artwork layers
        run: |
          python -m pip install --quiet Pillow==11.3.0
          python .github/scripts/prepare_intro.py app/src/main/res/drawable-nodpi
          test -s app/src/main/res/drawable-nodpi/scorium_intro_background.png
          test -s app/src/main/res/drawable-nodpi/scorium_intro_fog.png
          test -s app/src/main/res/drawable-nodpi/scorium_intro_wordmark.png
          test -s app/src/main/res/drawable-nodpi/scorium_intro_kernel.png
      - name: Optimise bundled DEV posters without touching originals
        if: github.ref_name == 'admin' || github.head_ref == 'admin'
        run: |
          python .github/scripts/optimize_posters.py app/src/main/assets/starter/posters
          test "$(find app/src/main/assets/starter/posters -name '*.jpg' | wc -l)" -eq 273
      - name: Restore persistent signing key
        env:
          SCORIUM_KEYSTORE_BASE64: ${{ secrets.SCORIUM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SCORIUM_KEYSTORE_BASE64" ]; then
            printf '%s' "$SCORIUM_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/scorium-release.jks"
            test -s "$RUNNER_TEMP/scorium-release.jks"
            echo "SCORIUM_KEYSTORE_PATH=$RUNNER_TEMP/scorium-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Persistent signing secrets not configured; debug APK cannot reliably update prior builds."
          fi
      - name: Build debug APK
        env:
          SCORIUM_KEYSTORE_PASSWORD: ${{ secrets.SCORIUM_KEYSTORE_PASSWORD }}
          SCORIUM_KEY_ALIAS: ${{ secrets.SCORIUM_KEY_ALIAS }}
          SCORIUM_KEY_PASSWORD: ${{ secrets.SCORIUM_KEY_PASSWORD }}
        run: |
          if [ "$GITHUB_REF_NAME" = "admin" ] || [ "$GITHUB_HEAD_REF" = "admin" ]; then
            gradle --no-daemon :app:assembleDebug -PscoriumAdmin=true
          else
            gradle --no-daemon :app:assembleDebug -PscoriumAdmin=false
          fi
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Scorium-${{ (github.ref_name == 'admin' || github.head_ref == 'admin') && 'Admin' || 'Final' }}-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
